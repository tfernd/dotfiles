# versions.toml — Pinned tool versions
# RULE: never install a version younger than the number of days in .freshness.
# uv and gh are pinned here and installed by install.sh on
# Debian, WSL (Debian-based), and macOS (quarantine window: .freshness).

[tools]
atuin = { version = "18.24.2", released = "2026-10-22" }
bat = { version = "0.26.1", released = "2025-12-02" }
bun = { version = "1.4.4", released = "2026-10-22" }
delta = { version = "0.20.1", released = "2026-10-04" }
eza = { version = "0.23.5", released = "2026-07-09" }
gh = { version = "2.103.3", released = "2026-10-26" }
starship = { version = "1.27.0", released = "2026-10-17" }
terraform = { version = "1.17.0", released = "2026-10-21" }
uv = { version = "0.13.6", released = "2026-10-27" }
zoxide = { version = "0.10.0", released = "2026-07-04" }
btm = { version = "0.14.9", released = "2026-08-27" }
fd = { version = "10.5.0", released = "2026-08-26" }
fzf = { version = "0.74.5", released = "2026-10-11" }
just = { version = "1.59.0", released = "2026-10-15" }
lazygit = { version = "0.66.2", released = "2026-10-16" }
rg = { version = "15.2.0", released = "2026-07-15" }
terraform-ls = { version = "0.39.0", released = "2026-07-23" }
yazi = { version = "26.9.1", released = "2026-09-01" }

[fonts]
firacode-nerd = { version = "3.5.1", released = "2026-08-21" }

[fixes]
# Fixed releases for known advisories (read by dotdoctor check).
# "fixed" lists one fixed version per release line; "released" gives the release
# date of each, in the same order. The .freshness quarantine applies here too.
# "affected" (optional) is the inclusive range "low high" of versions the CVE hits,
# compared with sort -V. An installed version inside it, with no fix on its release
# line, fails; without "affected", that case only warns.
# CVE-2026-111497: out-of-bounds write in the Brotli decoder (Brotli 1.0.3-1.2.0).
node-brotli = { fixed = "22.23.4 24.22.1 26.12.1", released = "2026-10-20 2026-10-20 2026-10-21", cve = "CVE-2026-111497", affected = "0 26.12.0" }
bun-brotli = { fixed = "1.4.4", released = "2026-10-22", cve = "CVE-2026-111497", affected = "0 1.4.3" }
libbrotli = { fixed = "1.0.10 1.1.1 1.2.1", released = "2026-10-21 2026-10-21 2026-10-21", cve = "CVE-2026-111497", affected = "1.0.3 1.2.0" }
python-brotli = { fixed = "1.2.1", released = "2026-10-21", cve = "CVE-2026-111497", affected = "0 1.2.0" }

[osv]
# OSV.dev "ecosystem:package" for each tool. dotdoctor check --advisories asks about
# the installed version. Add a line here to cover a new tool; no code change.
# Node and Bun are runtimes, not OSV packages: their bundled Brotli stays in [fixes].
atuin = "crates.io:atuin"
bat = "crates.io:bat"
btm = "crates.io:bottom"
delta = "crates.io:git-delta"
eza = "crates.io:eza"
fd = "crates.io:fd-find"
fzf = "Go:github.com/junegunn/fzf"
gh = "Go:github.com/cli/cli/v2"
just = "crates.io:just"
lazygit = "Go:github.com/jesseduffield/lazygit"
rg = "crates.io:ripgrep"
starship = "crates.io:starship"
terraform = "Go:github.com/hashicorp/terraform"
terraform-ls = "Go:github.com/hashicorp/terraform-ls"
uv = "PyPI:uv"
yazi = "crates.io:yazi-fm"
zoxide = "crates.io:zoxide"
