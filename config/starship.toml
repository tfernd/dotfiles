# ============================================================================
# 🚀 ULTRA GIT & EXTENDED STARSHIP THEME
# ============================================================================
format = """
$os\
$username\
$directory\
$hostname\
$git_branch\
${custom.git_tag}\
$git_commit\
$git_state\
$git_status\
$package\
$python\
$bun\
$nodejs\
$rust\
$golang\
$battery\
$fill\
$cmd_duration\
$jobs\
$time\
$line_break\
$sudo\
$status\
$character"""

command_timeout = 1500

# -----------------------------------------------------------------------------
# LINE 1: System, Directory & Full Git Suite
# -----------------------------------------------------------------------------
[os]
disabled = false
style = "bg:#7952b3 fg:#ffffff"
format = "[](#7952b3)[$symbol ]($style)[](fg:#7952b3 bg:#3a86ff)"

[os.symbols]
Pop = ""
Ubuntu = ""
Debian = ""
Macos = ""
Windows = "󰍲"
Linux = "󰌽"

[username]
disabled = true

# Standalone pill — not chained into os/user/dir (avoids SSH join clash)
[hostname]
ssh_only = true
style = "bg:#e17055 fg:#ffffff"
format = "[](#e17055)[ 󰣀 SSH: $hostname ]($style)[](#e17055) "

[directory]
style = "bg:#3a86ff fg:#ffffff"
format = "[  $path ]($style)[](fg:#3a86ff) "
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

[git_branch]
style = "bg:#ffbe0b fg:#1e1e2e"
symbol = ""
always_show_remote = false
truncation_length = 25
truncation_symbol = "…"
only_attached = true
format = "[](#ffbe0b)[ $symbol $branch ]($style)[](fg:#ffbe0b) "

[git_commit]
disabled = false
only_detached = true
commit_hash_length = 7
tag_disabled = false
tag_symbol = "  "
style = "bg:#e84393 fg:#ffffff"
format = "[](#e84393)[  DETACHED $hash$tag ]($style)[](fg:#e84393) "

# Exact tag while still on a branch (git_commit only runs when detached)
[custom.git_tag]
description = "Show release tag on an attached HEAD"
when = "git describe --tags --exact-match HEAD"
command = "git describe --tags --exact-match HEAD 2>/dev/null"
shell = ["sh"]
style = "bg:#a29bfe fg:#1e1e2e"
format = "[](#a29bfe)[  $output ]($style)[](fg:#a29bfe) "
ignore_timeout = true

[git_state]
disabled = false
style = "bg:#fd79a8 fg:#1e1e2e"
format = '[](#fd79a8)[ $state( $progress_current/$progress_total) ]($style)[](fg:#fd79a8) '
rebase = " REBASING"
merge = " MERGING"
revert = " REVERTING"
cherry_pick = " PICKING"
bisect = " BISECTING"
am = " APPLYING"
am_or_rebase = " AM/REBASE"

[git_status]
style = "bold #ff006e"
ignore_submodules = true
format = '([\[ $all_status$ahead_behind\] ]($style))'
conflicted = "[!${count}](bold #d63031) "
ahead = "[▲${count}](bold #38b000) "
behind = "[▼${count}](bold #d63031) "
diverged = "[▲${ahead_count} ▼${behind_count}](bold #d63031) "
stashed = "[▪${count}](bold #6c757d) "
staged = "[●${count}](bold #38b000) "
modified = "[○${count}](bold #ffbe0b) "
deleted = "[✕${count}](bold #d63031) "
untracked = "[?${count}](bold #3a86ff) "
renamed = "[»${count}](bold #8338ec) "
typechanged = "[◈${count}](bold #ffbe0b) "

[git_metrics]
disabled = true
ignore_submodules = true
added_style = "bold #38b000"
deleted_style = "bold #d63031"
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"

[cmd_duration]
min_time = 200
format = "[󱎫 $duration ](bold #ffbe0b)"
show_milliseconds = false

[jobs]
symbol = "✦"
style = "bold #ff006e"
format = "[$symbol$number ]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:#343a40 fg:#f8f9fa"
format = "[](#343a40)[  $time ]($style)[](#343a40)"

# -----------------------------------------------------------------------------
# Runtimes (same line as git; hidden when not in a matching project)
# -----------------------------------------------------------------------------
[package]
disabled = false
symbol = "📦 "
style = "bold #ffbe0b"
format = "[$symbol$version ]($style)"

[python]
disabled = false
symbol = " "
style = "bold #4b8bbe"
python_binary = [".venv/bin/python", "python", "python3"]
format = 'via [$symbol($version )(\($virtualenv\) )]($style)'

[bun]
disabled = false
symbol = "󰛦 "
style = "bold #fbf0df"
format = "via [$symbol$version ]($style)"

[nodejs]
disabled = false
symbol = " "
style = "bold #68a063"
format = "via [$symbol$version ]($style)"

[rust]
disabled = false
symbol = "🦀 "
style = "bold #dea584"
format = "via [$symbol$version ]($style)"

[golang]
disabled = false
symbol = " "
style = "bold #00add8"
format = "via [$symbol$version ]($style)"

[battery]
disabled = false
display = [
    { threshold = 20, style = "bold red", charging_symbol = "⚡" },
    { threshold = 50, style = "bold yellow", charging_symbol = "⚡" },
]

# -----------------------------------------------------------------------------
# LINE 2: Prompt & Failure State
# -----------------------------------------------------------------------------
[sudo]
disabled = false
symbol = "⚠️"
style = "bg:#d63031 fg:#ffffff bold"
format = "[](#d63031)[ $symbol SUDO ACTIVE ]($style)[](#d63031) "

[status]
disabled = false
style = "bold #d63031"
symbol = "💥"
not_found_symbol = "🔍"
sigint_symbol = "🛑"
not_executable_symbol = "🚫"
signal_symbol = "⚡"
map_symbol = true
pipestatus = true
format = '[$symbol $common_meaning$signal_name ($status) ]($style)'
pipestatus_format = '[$pipestatus => $symbol $common_meaning$signal_name ($status) ]($style)'

[character]
success_symbol = "[➜](bold #38b000)"
error_symbol = "[➜](bold #d63031)"

[fill]
symbol = " "
